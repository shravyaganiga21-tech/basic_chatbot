<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberMentor AI</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="chat">
    <header class="chat-header">
      <h1>CyberMentor AI</h1>
      <button id="new-chat" type="button">Clear chat</button>
    </header>

    <section class="chat-messages" id="messages" aria-live="polite" aria-label="Chat messages">
      <p class="welcome-message">Hi! Type a message to get started.</p>
    </section>

    <form class="chat-form" id="message-form">
      <label class="visually-hidden" for="message-input">Your message</label>
      <textarea id="message-input" rows="1" placeholder="Type your message..." required></textarea>
      <button type="submit">Send</button>
    </form>
  </main>
</body>
</html>
